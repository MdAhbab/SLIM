# Stage 1 pilots: SLIM-GA, seed 0, under the extended protocol. Validation is
# two whole held-out cell lines (HepG2 and A549, in situ Hi-C), training drops
# every row that repeats a validation or test pair, and each epoch draws a
# fresh, cell-balanced sample. The pilots differ only in their training rows
# (phase2_p0.yaml, phase2_p1a.yaml, phase2_p1b.yaml). Test metrics are logged
# every epoch to measure whether this validation predicts test; they are never
# used to choose. Paths are the training PC's; Kaggle jobs override them.
extends: slim_ga.yaml

experiment_name: "phase2_pilot"

paths:
  bengi_dirs:
    - "D:/E/AI Models/FYDP-Model/data/BENGI"
    - "D:/E/AI Models/FYDP-Model/data/BENGI_extended"
  test_dirs:
    - "D:/E/AI Models/FYDP-Model/data/BENGI"
  exclusion_files:
    - "D:/E/AI Models/FYDP-Model/data/BENGI_extra_test/*_rao2014-Benchmark.v3.tsv.gz"
  feats_config: "D:/E/AI Models/FYDP-Model/data/genomic_data/phase2/features.json"

data:
  modalities: "epi"          # the protocol the September pilots chose
  never_train: ["HMEC", "NHEK", "HUVEC"]
  exclude_eval_pairs: true

training:
  valid_cells: ["HepG2", "A549"]
  valid_samples: 100000
  samples_per_epoch: 200000
  epochs: 6
  patience: 2
  log_test_each_epoch: true
  num_workers: 2
