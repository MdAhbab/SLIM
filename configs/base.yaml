# Settings shared by every model. A variant configuration extends this file
# and overrides only the keys that define the variant, so no variant can
# accidentally differ in the data pipeline, the optimizer or the budget.

# Absolute paths to the shared dataset. They are used verbatim by training,
# testing and evaluation, so every command reads the same files no matter
# which directory it is issued from. A relative path here would be resolved
# against the project root instead.
paths:
  bengi_dir: "D:/E/AI Models/FYDP-Model/data/BENGI"
  feats_config: "D:/E/AI Models/FYDP-Model/data/genomic_data/CTCF_DNase_6histone_local.500.json"
  ref_genome: "D:/E/AI Models/FYDP-Model/data/hg19.fa"

data:
  sequence_length: 6000      # 3000 bp enhancer plus 3000 bp promoter
  epigenetic_bins: 5000      # a 2.5 Mb window in 500 bp bins
  n_epigenetic_features: 9   # one position channel plus eight chromatin tracks
  kmer_size: 3
  batch_size: 32             # measured to fit a 16 GB card with headroom for
                             # every variant, the KAN one included. At 64 the
                             # KAN variant reserves ~18.7 GB, spills into host
                             # memory and runs about 2.6x slower per sample.
  bin_size: 500
  seq_len_bp: 2500000
  enhancer_window: 3000
  promoter_window: 3000
  encoder_fit_samples: 5000  # per chromosome half under crossfit
  encoder_fit: "crossfit"    # crossfit | train. The sequence encoding is fitted
                             # on labelled sequences. "train" (the original
                             # rule) fits it on training rows that are then
                             # trained on, so those rows carry their own label
                             # into their encoding. "crossfit" fits one encoder
                             # per chromosome half (odd, even) and encodes every
                             # row with the encoder of the other half.
  modalities: "all"          # all | seq | seq+pos | epi (no DNA branch)
  # Which training rows are used. BENGI gives GM12878 and HeLa three assay
  # files each (HiC, CTCF-ChIAPET, RNAPII-ChIAPET), while the test cell lines
  # have Hi-C only. ChIA-PET positives are much closer together (median 31 kb
  # against 90-230 kb for Hi-C), so mixing them teaches a distance rule that
  # does not hold on the test assay (scripts/audit_dataset.py). The pilot runs
  # choose between these on Hi-C validation; see scripts/choose_protocol.py.
  train_assays:              # empty for every assay
    - "HiC"
  dedup: "union"             # none | union. union merges rows that repeat one
                             # (cell, enhancer, transcript start) pair across
                             # assay files, labelled positive if any file is.
  feats_order:
    - "CTCF"
    - "DNase"
    - "H3K27ac"
    - "H3K27me3"
    - "H3K36me3"
    - "H3K4me1"
    - "H3K4me3"
    - "H3K9me3"

model:
  hidden_dim: 180            # token width, shared by both branches
  num_heads: 6               # 180 / 6 = 30 per head
  num_layers: 3              # encoder depth
  n_tokens: 128              # tokens produced by the sequence branch
  dropout: 0.1
  head_dropout: 0.2
  kan_hidden: 64             # spline layer width, [180, 64, 180]
  sa_da: 64                  # pooling attention hidden width
  sa_r: 32                   # pooling attention heads
  att_penalty: 0.1           # Frobenius penalty keeping pooling heads distinct
  drop_path_rate: 0.1        # stochastic depth, same for every encoder

training:
  lr: 0.0001                 # peak learning rate
  epochs: 8                  # the most any run may train; early stopping ends
                             # most runs sooner
  lambda_dist: 1.0           # weight of the distance regression loss
  grad_clip: 1.0
  patience: 2                # epochs without a better validation score; the
                             # weight average keeps validation smooth enough
  weight_decay: 0.05         # identical for every variant
  no_decay_1d: true          # biases and normalisation scales are not decayed
  scheduler: "warmup_cosine" # linear warm-up, then cosine to min_lr_ratio
  warmup_fraction: 0.03
  min_lr_ratio: 0.05
  ema_decay: 0.999           # validate, select and test an average of the
                             # weights; 0 switches it off
  train_eval_samples: 10000  # fixed training sample scored like validation
                             # each epoch, for a clean overfitting gap
  use_cosine_scheduler: false
  entropy_loss_weight: 0.01      # keeps the survival gate from collapsing
  diversity_loss_weight: 0.05    # keeps memory slots distinct
  prediction_loss_weight: 1.0     # trains the memory's token predictor. It is the
                                 # only gradient those weights receive, so Adam
                                 # cancels its scale; measured at 0.5 percent of
                                 # the task gradient norm, so clipping is unaffected.
  use_amp: true
  num_workers: 4             # keeps the GPU fed without exhausting shared memory
  prefetch_factor: 2
  persistent_workers: false
  valid_chroms:              # held out for validation inside the training cells
    - "chr11"
    - "chr17"
  valid_assays:              # validation scored on the test assay only, so
    - "HiC"                  # checkpoint selection rewards what the test asks

augmentation:
  enabled: true
  rc_prob: 0.5               # reverse complement
  rc_mode: "segment"         # each sequence in place, enhancer kept first
  epi_noise_std: 0.05        # Gaussian noise on chromatin channels
  shift_max_bins: 3          # random bin shift
  shift_mode: "tracks"       # chromatin tracks only, zero-filled; the position
                             # channel stays aligned with the anchors
