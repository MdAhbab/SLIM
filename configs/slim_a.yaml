# SLIM variant A: survival-gated encoder, rectified feed-forward layer.
extends: base.yaml

experiment_name: "slim_a"

model:
  variant: "A"           # ffn_type gelu, hidden 4 x 180 = 720

  memory:
    local_window: 64             # each token attends to 32 neighbours each side
    bin_slots: 16                # bounded memory capacity
    bin_dim: 96                  # width of a memory slot
    survivors_per_layer: 8       # tokens written to memory per layer
    ffn_multiplier: 4            # feed-forward width for the rectified unit
    gate_temperature: 1.0
    novelty_weight: 0.35         # alpha, the novelty term in the survival score
    prediction_error_weight: 0.20  # beta, the prediction-error term
    bin_decay: 0.92              # gamma, decay applied to aged slots
    bin_update: "gru"            # gru | fifo | attention
    use_learned_score: true      # set false to isolate the other gate terms
    use_novelty: true
    use_prediction_error: true
    # Memory behaviour (see src/memory_encoder.py). The legacy comparison run,
    # configs/slim_ka_legacy.yaml, turns these back to the original rules.
    slot_addressing: "content"     # survivors take the most similar free slot
    prediction_target: "position"  # predict each token from memory + position
    memory_norm: "written"         # normalise written slots only, so decay acts
    respect_segments: true         # local window stops at the DNA and chromatin seams
    # Kept at the original rule on purpose. "all" lets the task gradient reach
    # every score, but in short real-data runs it made the gate write the same
    # positions for every input (overlap 0.93 and 0.83 against 0.33 and 0.45
    # for "selected", two seeds); selection_noise did not prevent that.
    gate_gradient: "selected"
    selection_noise: 0.0
