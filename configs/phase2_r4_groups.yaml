# R4: the chromatin branch as six functional branches, one convolution per
# group of tracks, combined by a per-token gate that starts even
# (src/pair_modules.py, GroupedChromatinStem). Each branch also reads the
# position channel; the gate's weights are kept for interpretation. Kept on
# non-inferiority, for interpretability. On top of R0.
extends: phase2_r0.yaml

experiment_name: "phase2_r4_groups"
output_name: "phase2_r4_groups"

model:
  chromatin_stem: "groups"
  chromatin_groups:          # names absent from data.feats_order are skipped
    accessibility: ["DNase"]
    active: ["H3K27ac", "H3K4me1"]
    promoter: ["H3K4me3"]
    transcription: ["H3K36me3"]
    repressive: ["H3K27me3", "H3K9me3"]
    architecture: ["CTCF", "CTCFmotif_plus", "CTCFmotif_minus",
                   "YY1motif_plus", "YY1motif_minus"]
